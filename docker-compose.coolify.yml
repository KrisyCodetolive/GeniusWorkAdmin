# ===========================================
# Docker Compose pour Coolify — Genius Work
# ===========================================
# Coolify gère déjà :
#   - Le reverse proxy (Traefik)
#   - Le SSL automatique (Let's Encrypt)
#   - Le domaine personnalisé
#
# Variables à configurer dans l'UI Coolify :
#   APP_KEY, APP_URL, DB_PASSWORD, DB_ROOT_PASSWORD
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-genius_work}
      - DB_USERNAME=${DB_USERNAME:-genius}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - storage-data:/var/www/html/storage
      - videos-data:/var/www/html/public/videos
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coolify

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-genius_work}
      MYSQL_USER: ${DB_USERNAME:-genius}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - coolify

volumes:
  storage-data:
  videos-data:
  db-data:

networks:
  coolify:
    driver: bridge
