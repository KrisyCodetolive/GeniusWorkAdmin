# ===========================================
# Docker Compose pour Coolify — Genius Work
# ===========================================
# Utilise la base de données gérée par Coolify
# (ne pas inclure le service db ici)
#
# Variables à configurer dans l'UI Coolify :
#   APP_KEY, APP_URL, DB_HOST, DB_PORT, DB_DATABASE,
#   DB_USERNAME, DB_PASSWORD
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-default}
      - DB_USERNAME=${DB_USERNAME:-mysql}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - storage-data:/var/www/html/storage
      - videos-data:/var/www/html/public/videos
    expose:
      - "80"
    networks:
      - coolify

volumes:
  storage-data:
  videos-data:

networks:
  coolify:
    driver: bridge
