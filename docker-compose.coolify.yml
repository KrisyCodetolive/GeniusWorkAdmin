# ===========================================
# Docker Compose pour Coolify — Genius Work
# ===========================================
# Utilise la base de données et Redis gérés par Coolify
# ===========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-default}
      - DB_USERNAME=${DB_USERNAME:-mysql}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_ENV=production
      - APP_DEBUG=${APP_DEBUG:-false}
      - GENIUS_TOOLS_API_KEY=${GENIUS_TOOLS_API_KEY:-}
      - GENIUS_TOOLS_BASE_URL=${GENIUS_TOOLS_BASE_URL:-https://linkqr.genius.ci/api}
      - REDIS_CLIENT=${REDIS_CLIENT:-phpredis}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
    volumes:
      - storage-data:/var/www/html/storage
      - videos-data:/var/www/html/public/videos
    expose:
      - "80"
    networks:
      - coolify

volumes:
  storage-data:
  videos-data:

networks:
  coolify:
    driver: bridge
