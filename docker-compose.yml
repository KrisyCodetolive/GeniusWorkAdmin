# Environnement de développement : app + queue + MySQL + Redis
# Lancement : docker compose up -d --build   →  http://localhost:8000/admin
x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: genius_work
  DB_USERNAME: genius
  DB_PASSWORD: secret
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "null"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

x-app-volumes: &app-volumes
  - .:/var/www/html
  # vendor dans un volume Linux : beaucoup plus rapide que le montage Windows
  - geniuswork-vendor:/var/www/html/vendor

services:
  app:
    image: geniuswork-app-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: geniuswork-app
    restart: unless-stopped
    environment: *app-env
    ports:
      - "8000:8000"
    volumes: *app-volumes
    # Serveur PHP direct : artisan serve ignorerait les variables DB_/REDIS_ au profit du .env
    working_dir: /var/www/html/public
    command: php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    image: geniuswork-app-dev
    container_name: geniuswork-queue
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    command: php artisan queue:work --tries=3
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: geniuswork-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: genius_work
      MYSQL_USER: genius
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - geniuswork-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: geniuswork-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - geniuswork-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  geniuswork-mysql-data:
  geniuswork-redis-data:
  geniuswork-vendor:
